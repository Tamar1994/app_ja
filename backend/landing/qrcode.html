<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baixe o Já! — Disponível nas lojas</title>
  <meta name="description" content="Baixe o Já! agora na Google Play e App Store. Serviços domésticos com profissionais verificados, na palma da sua mão." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF6B00;
      --orange-dark: #E05A00;
      --orange-light: #FF8C38;
      --dark: #0F0F0F;
      --dark2: #1A1A1A;
      --dark3: #242424;
      --text: #FAFAFA;
      --text-muted: #A0A0A0;
      --text-dim: #555;
      --border: rgba(255,255,255,0.08);
      --radius: 20px;
      --radius-sm: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* ─── GLOW BG ─── */
    .bg-glow-top {
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 900px;
      background: radial-gradient(circle, rgba(255,107,0,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-bottom {
      position: fixed;
      bottom: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,107,0,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── MAIN CARD ─── */
    .card {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: calc(100% - 48px);
      margin: 40px auto;
      text-align: center;
    }

    /* ─── LOGO ─── */
    .logo-wrap {
      margin-bottom: 36px;
    }

    .logo-wrap img {
      height: 72px;
      width: auto;
      filter: drop-shadow(0 8px 28px rgba(255,107,0,0.4));
    }

    /* ─── BADGE ─── */
    .launch-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,200,83,0.12);
      border: 1px solid rgba(0,200,83,0.3);
      color: #00C853;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 50px;
      margin-bottom: 28px;
    }

    .badge-dot {
      width: 7px; height: 7px;
      background: #00C853;
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ─── TITLE ─── */
    h1 {
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.05;
      margin-bottom: 16px;
    }

    h1 span { color: var(--orange); }

    .subtitle {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 40px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ─── STORE BUTTONS ─── */
    .store-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .store-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border: 1px solid rgba(255,107,0,0.3);
      background: var(--dark2);
      transition: border-color 0.2s, transform 0.15s, background 0.2s;
    }

    .store-btn:hover {
      border-color: var(--orange);
      background: rgba(255,107,0,0.06);
      transform: translateY(-2px);
    }

    .store-btn:active { transform: translateY(0); }

    .store-btn-icon { font-size: 28px; flex-shrink: 0; }

    .store-btn-text { text-align: left; }

    .store-btn-sub {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .store-btn-name {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .store-btn-arrow {
      margin-left: auto;
      font-size: 20px;
      color: var(--orange);
    }

    /* ─── FOOTER ─── */
    .page-footer {
      margin-top: 48px;
      padding-bottom: 32px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .page-footer a {
      font-size: 13px;
      color: var(--text-dim);
      text-decoration: none;
    }

    .page-footer a:hover { color: var(--orange); }

    .page-footer span { color: var(--text-dim); margin: 0 8px; }


  </style>
</head>
<body>

  <div class="bg-glow-top"></div>
  <div class="bg-glow-bottom"></div>

  <div class="card">

    <!-- LOGO -->
    <div class="logo-wrap">
      <img src="/landing/logo.png" alt="Já!" />
    </div>

    <!-- BADGE -->
    <div class="launch-badge">
      <div class="badge-dot"></div>
      Disponível agora nas lojas
    </div>

    <!-- TITLE -->
    <h1>Baixe o <span>Já!</span><br/>e transforme seu lar.</h1>
    <p class="subtitle">
      Serviços domésticos com profissionais verificados, na palma da sua mão. Disponível para Android e iOS.
    </p>

    <!-- STORE BUTTONS -->
    <div class="store-buttons">
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.ja.app" target="_blank" rel="noopener">
        <div class="store-btn-icon">🤖</div>
        <div class="store-btn-text">
          <span class="store-btn-sub">Disponível na</span>
          <span class="store-btn-name">Google Play</span>
        </div>
        <span class="store-btn-arrow">→</span>
      </a>
      <a class="store-btn" href="https://apps.apple.com/br/app/j%C3%A1/id6771898396" target="_blank" rel="noopener">
        <div class="store-btn-icon">🍎</div>
        <div class="store-btn-text">
          <span class="store-btn-sub">Disponível na</span>
          <span class="store-btn-name">App Store</span>
        </div>
        <span class="store-btn-arrow">→</span>
      </a>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="page-footer">
    <a href="/">Voltar para o site</a>
    <span>·</span>
    <a href="https://instagram.com/chame_ja" target="_blank" rel="noopener">@chame_ja</a>
  </div>


</body>
</html>
